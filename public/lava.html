<!DOCTYPE html>
<html>

<head>
    <title>Circles: Manifold Interaction</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
            color: #0f0;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }
        input {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            width: 300px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="ui">
        <input id="seed" placeholder="animalia" value="animalia">
        <button id="extract">Extract Manifold</button>
        <div id="status">Ready</div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "/deps/three.js",
            "three/addons/": "/deps/three/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);

        // Add lights
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        // 2. The "Membrane" (Marching Cubes)
        // This is the single mesh that will hold ALL concepts
        const resolution = 64;
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x00ff88,
            transmission: 0.9,  // Glass-like
            opacity: 1,
            metalness: 0,
            roughness: 0,
            ior: 1.5,
            thickness: 2,
            clearcoat: 1,
            side: THREE.DoubleSide
        });

        const membrane = new MarchingCubes(resolution, material, true, true, 100000);
        membrane.position.set(0, 0, 0);
        membrane.scale.set(10, 10, 10);
        membrane.isolation = 80; // Critical: sets the iso-surface threshold
        scene.add(membrane);

        // 3. Concepts (The Physics Nodes)
        let concepts = [];
        const labels = [];
        let allCentroids = [];

        function projectTo3D(centroids) {
            // Use PCA to project high-dim centroids to 3D
            const matrix = centroids.map(c => c.slice(0, 100)); // Use first 100 dims for speed
            const mean = matrix[0].map((_, i) => matrix.reduce((sum, row) => sum + row[i], 0) / matrix.length);
            const centered = matrix.map(row => row.map((val, i) => val - mean[i]));
            
            // Simple projection: use first 3 dimensions scaled
            return centered.map(row => ({
                x: row[0] * 10,
                y: row[1] * 10,
                z: row[2] * 10
            }));
        }

        function createLabel(text, position) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 24px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(2, 0.5, 1);
            sprite.position.set(position.x, position.y + 2, position.z);
            scene.add(sprite);
            return sprite;
        }

        async function loadConcept(seed, position) {
            // Get hierarchy
            const hierRes = await fetch('/api/hierarchy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seed, depth: 3 })
            });
            const hierData = await hierRes.json();
            
            if (hierData.status === 'success') {
                const allSeeds = [hierData.parent, seed, ...hierData.children];
                const metaballs = [];
                
                // Get metaball data for all concepts
                for (const s of allSeeds) {
                    const res = await fetch('/api/metaball', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ seed: s })
                    });
                    const meta = await res.json();
                    if (meta.status === 'success') {
                        metaballs.push(meta.data);
                    }
                }
                
                // Project all centroids to 3D
                allCentroids = metaballs.map(m => m.centroid);
                const positions3d = projectTo3D(allCentroids);
                
                // Create concepts with semantic positions
                // Parent gets larger strength to encompass children
                metaballs.forEach((meta, i) => {
                    const isParent = i === 0;
                    const isSeed = i === 1;
                    
                    concepts.push({
                        label: meta.seed,
                        x: positions3d[i].x,
                        y: positions3d[i].y,
                        z: positions3d[i].z,
                        strength: isParent ? meta.strength * 2 : meta.strength,
                        radius: isParent ? meta.radius * 1.5 : meta.radius,
                        vx: 0, vy: 0, vz: 0
                    });
                    labels.push(createLabel(meta.seed, positions3d[i]));
                });
            }
        }

        // Simple spring physics loop
        function updatePhysics() {
            const k = 0.01;
            const damping = 0.95;
            const restLength = 3.0;

            // Apply spring forces between all concepts
            for (let i = 0; i < concepts.length; i++) {
                for (let j = i + 1; j < concepts.length; j++) {
                    const dx = concepts[j].x - concepts[i].x;
                    const dy = concepts[j].y - concepts[i].y;
                    const dz = concepts[j].z - concepts[i].z;
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (dist > 0.1) {
                        const force = (dist - restLength) * k;
                        const fx = (dx / dist) * force;
                        const fy = (dy / dist) * force;
                        const fz = (dz / dist) * force;

                        concepts[i].vx += fx;
                        concepts[i].vy += fy;
                        concepts[i].vz += fz;
                        concepts[j].vx -= fx;
                        concepts[j].vy -= fy;
                        concepts[j].vz -= fz;
                    }
                }
            }

            // Update positions
            concepts.forEach((c, i) => {
                c.x += c.vx;
                c.y += c.vy;
                c.z += c.vz;
                c.vx *= damping;
                c.vy *= damping;
                c.vz *= damping;
                
                // Update label position
                if (labels[i]) {
                    labels[i].position.set(c.x, c.y + 2, c.z);
                }
            });
        }

        // 4. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();

            // Reset the scalar field
            membrane.reset();

            // Add each concept as a "blob" to the field
            concepts.forEach(c => {
                // Map world coordinates to 0..1 marching cubes grid space
                const gx = (c.x / 10) + 0.5;
                const qy = (c.y / 10) + 0.5;
                const gz = (c.z / 10) + 0.5;

                // addBall(x, y, z, strength, subtract_offset, color)
                membrane.addBall(gx, qy, gz, c.strength, 10);
            });

            // Update the mesh geometry
            membrane.update();
            renderer.render(scene, camera);
        }
        animate();

        // UI
        const extractBtn = document.getElementById('extract');
        const seedInput = document.getElementById('seed');
        const status = document.getElementById('status');

        extractBtn.onclick = async () => {
            const seed = seedInput.value.trim();
            status.textContent = '⏳ Loading...';
            extractBtn.disabled = true;
            concepts = [];
            labels.forEach(l => scene.remove(l));
            labels.length = 0;

            try {
                await loadConcept(seed, { x: 0, y: 0, z: 0 });
                status.textContent = `✅ ${seed} + ${concepts.length - 1} neighbors`;
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>

</html>
