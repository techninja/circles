<!DOCTYPE html>
<html>

<head>
    <title>Circles: Manifold Interaction</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: monospace;
            color: #0f0;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }
        input {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            width: 300px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="ui">
        <input id="seed" placeholder="animalia" value="animalia">
        <button id="extract">Extract Manifold</button>
        <div id="status">Ready</div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "/deps/three.js",
            "three/addons/": "/deps/three/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);

        // Add lights
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        // 2. The "Membrane" (Marching Cubes)
        // This is the single mesh that will hold ALL concepts
        const resolution = 64;
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x00ff88,
            transmission: 0.9,  // Glass-like
            opacity: 1,
            metalness: 0,
            roughness: 0,
            ior: 1.5,
            thickness: 2,
            clearcoat: 1,
            side: THREE.DoubleSide
        });

        const membrane = new MarchingCubes(resolution, material, true, true, 100000);
        membrane.position.set(0, 0, 0);
        membrane.scale.set(10, 10, 10);
        membrane.isolation = 80; // Critical: sets the iso-surface threshold
        scene.add(membrane);

        // 3. Concepts (The Physics Nodes)
        let concepts = [];

        async function loadConcept(seed, position) {
            // Get neighbors
            const neighRes = await fetch('/api/neighbors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seed, count: 3 })
            });
            const neighData = await neighRes.json();
            
            if (neighData.status === 'success') {
                // Get metaball properties for seed
                const seedRes = await fetch('/api/metaball', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seed })
                });
                const seedMeta = await seedRes.json();
                
                if (seedMeta.status === 'success') {
                    concepts.push({ 
                        label: seed, 
                        x: position.x, 
                        y: position.y, 
                        z: position.z, 
                        strength: seedMeta.data.strength,
                        radius: seedMeta.data.radius,
                        vx: 0, vy: 0, vz: 0 
                    });
                }
                
                // Get metaball properties for neighbors
                const radius = 4;
                for (let i = 0; i < neighData.neighbors.length; i++) {
                    const neighbor = neighData.neighbors[i];
                    const angle = (i / neighData.neighbors.length) * Math.PI * 2;
                    
                    const nRes = await fetch('/api/metaball', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ seed: neighbor })
                    });
                    const nMeta = await nRes.json();
                    
                    if (nMeta.status === 'success') {
                        concepts.push({
                            label: neighbor,
                            x: position.x + Math.cos(angle) * radius,
                            y: position.y,
                            z: position.z + Math.sin(angle) * radius,
                            strength: nMeta.data.strength,
                            radius: nMeta.data.radius,
                            vx: 0, vy: 0, vz: 0
                        });
                    }
                }
            }
        }

        // Simple spring physics loop
        function updatePhysics() {
            const k = 0.01;
            const damping = 0.95;
            const restLength = 3.0;

            // Apply spring forces between all concepts
            for (let i = 0; i < concepts.length; i++) {
                for (let j = i + 1; j < concepts.length; j++) {
                    const dx = concepts[j].x - concepts[i].x;
                    const dy = concepts[j].y - concepts[i].y;
                    const dz = concepts[j].z - concepts[i].z;
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (dist > 0.1) {
                        const force = (dist - restLength) * k;
                        const fx = (dx / dist) * force;
                        const fy = (dy / dist) * force;
                        const fz = (dz / dist) * force;

                        concepts[i].vx += fx;
                        concepts[i].vy += fy;
                        concepts[i].vz += fz;
                        concepts[j].vx -= fx;
                        concepts[j].vy -= fy;
                        concepts[j].vz -= fz;
                    }
                }
            }

            // Update positions
            concepts.forEach(c => {
                c.x += c.vx;
                c.y += c.vy;
                c.z += c.vz;
                c.vx *= damping;
                c.vy *= damping;
                c.vz *= damping;
            });
        }

        // 4. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();

            // Reset the scalar field
            membrane.reset();

            // Add each concept as a "blob" to the field
            concepts.forEach(c => {
                // Map world coordinates to 0..1 marching cubes grid space
                const gx = (c.x / 10) + 0.5;
                const qy = (c.y / 10) + 0.5;
                const gz = (c.z / 10) + 0.5;

                // addBall(x, y, z, strength, subtract_offset, color)
                membrane.addBall(gx, qy, gz, c.strength, 10);
            });

            // Update the mesh geometry
            membrane.update();
            renderer.render(scene, camera);
        }
        animate();

        // UI
        const extractBtn = document.getElementById('extract');
        const seedInput = document.getElementById('seed');
        const status = document.getElementById('status');

        extractBtn.onclick = async () => {
            const seed = seedInput.value.trim();
            status.textContent = '⏳ Loading...';
            extractBtn.disabled = true;
            concepts = [];

            try {
                await loadConcept(seed, { x: 0, y: 0, z: 0 });
                status.textContent = `✅ ${seed} + ${concepts.length - 1} neighbors`;
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>

</html>
