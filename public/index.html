<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Circles - Semantic Manifold</title>
    <style>
        body { margin: 0; font-family: monospace; background: #0a0a0a; color: #0f0; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; width: 300px; }
        button { background: #0f0; color: #000; border: none; padding: 8px 16px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <input id="tokens" placeholder="animalia" value="animalia">
        <button id="extract">Extract Manifold</button>
        <div id="status"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "/deps/three.js",
            "three/addons/": "/deps/three/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const extractBtn = document.getElementById('extract');
        const tokensInput = document.getElementById('tokens');

        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a0a);
        camera.position.set(3, 3, 5);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;

        // Lighting
        const light = new THREE.DirectionalLight(0x00ff88, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x003322, 0.5));

        let volumeMesh = null;

        function createVolumeVisualization(data) {
            if (volumeMesh) scene.remove(volumeMesh);

            const res = data.resolution;
            const field = data.field;
            
            // Find min/max for better threshold
            const min = Math.min(...field);
            const max = Math.max(...field);
            const threshold = min + (max - min) * 0.3; // Top 70% of values

            console.log(`Volume stats: min=${min}, max=${max}, threshold=${threshold}`);
            console.log(`Resolution: ${res}x${res}x${res} = ${field.length} values`);

            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            for (let i = 0; i < res; i++) {
                for (let j = 0; j < res; j++) {
                    for (let k = 0; k < res; k++) {
                        const idx = i * res * res + j * res + k;
                        const value = field[idx];
                        
                        if (value > threshold) {
                            const x = (i / res - 0.5) * 4;
                            const y = (j / res - 0.5) * 4;
                            const z = (k / res - 0.5) * 4;
                            
                            positions.push(x, y, z);
                            
                            // Color based on intensity
                            const intensity = (value - min) / (max - min);
                            colors.push(0, intensity, intensity * 0.5);
                        }
                    }
                }
            }

            console.log(`Generated ${positions.length / 3} points`);

            if (positions.length === 0) {
                status.textContent = '❌ No points above threshold';
                return;
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ 
                size: 0.1, 
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            volumeMesh = new THREE.Points(geometry, material);
            scene.add(volumeMesh);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            if (volumeMesh) {
                volumeMesh.rotation.y += 0.002;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // WebSocket
        const ws = new WebSocket(`ws://${location.host}`);
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'ollama_status') {
                status.textContent = msg.ready ? '🟢 Ollama ready' : '🟡 Ollama starting...';
                extractBtn.disabled = !msg.ready;
            }
        };

        extractBtn.onclick = async () => {
            const seed = tokensInput.value.trim();
            status.textContent = '⏳ Extracting volume (this may take 30s)...';
            extractBtn.disabled = true;

            try {
                const res = await fetch('/api/volume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seed, model: 'llama3:8b', resolution: 32 })
                });

                const data = await res.json();
                console.log('Received data:', data);
                
                if (data.status === 'success') {
                    createVolumeVisualization(data.data);
                    status.textContent = `✅ Manifold: ${seed}`;
                } else {
                    status.textContent = `❌ ${data.detail || 'Unknown error'}`;
                }
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
                console.error(err);
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
