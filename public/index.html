<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Circles - Semantic Manifold</title>
    <style>
        body {
            margin: 0;
            font-family: monospace;
            background: #0a0a0a;
            color: #0f0;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        input {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            width: 300px;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
        }

        #canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="ui">
        <input id="tokens" placeholder="animalia" value="animalia">
        <button id="extract">Discover Manifold</button>
        <div id="status"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "/deps/three.js",
            "matter-js": "/deps/matter-js.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const status = document.getElementById('status');
        const extractBtn = document.getElementById('extract');
        const tokensInput = document.getElementById('tokens');
        const canvas = document.getElementById('canvas');

        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a0a);
        camera.position.z = 5;

        const manifolds = [];
        const connections = [];

        function createManifold(data, allData) {
            const geometry = new THREE.IcosahedronGeometry(0.4, 2);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88, 
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(data.x, data.y, data.z);
            sphere.userData = { originalPos: new THREE.Vector3(data.x, data.y, data.z), velocity: new THREE.Vector3() };
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            ctx.fillStyle = '#0f0';
            ctx.font = '24px monospace';
            ctx.fillText(data.label, 10, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.set(data.x, data.y + 0.5, data.z);
            sprite.scale.set(1, 0.25, 1);
            
            scene.add(sphere);
            scene.add(sprite);
            manifolds.push({ sphere, sprite, data });
            
            // Create connections to nearby manifolds
            allData.forEach(other => {
                if (other.label !== data.label) {
                    const dist = Math.sqrt(
                        Math.pow(data.x - other.x, 2) +
                        Math.pow(data.y - other.y, 2) +
                        Math.pow(data.z - other.z, 2)
                    );
                    if (dist < 2) {
                        const lineMat = new THREE.LineBasicMaterial({ 
                            color: 0x00ff88, 
                            transparent: true, 
                            opacity: 0.2 
                        });
                        const points = [new THREE.Vector3(data.x, data.y, data.z), 
                                       new THREE.Vector3(other.x, other.y, other.z)];
                        const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(lineGeom, lineMat);
                        scene.add(line);
                        connections.push(line);
                    }
                }
            });
        }

        function frameManifolds() {
            if (manifolds.length === 0) return;
            const box = new THREE.Box3();
            manifolds.forEach(m => box.expandByObject(m.sphere));
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
            camera.position.set(center.x, center.y, center.z + cameraZ);
            camera.lookAt(center);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Elastic membrane physics
            manifolds.forEach((m, i) => {
                const sphere = m.sphere;
                const vel = sphere.userData.velocity;
                const orig = sphere.userData.originalPos;
                
                // Spring back to original position
                const restoreForce = orig.clone().sub(sphere.position).multiplyScalar(0.02);
                vel.add(restoreForce);
                
                // Repulsion from other manifolds
                manifolds.forEach((other, j) => {
                    if (i !== j) {
                        const diff = sphere.position.clone().sub(other.sphere.position);
                        const dist = diff.length();
                        if (dist < 1.5) {
                            vel.add(diff.normalize().multiplyScalar(0.01 / dist));
                        }
                    }
                });
                
                vel.multiplyScalar(0.95); // Damping
                sphere.position.add(vel);
                m.sprite.position.copy(sphere.position).add(new THREE.Vector3(0, 0.5, 0));
                
                // Wobble effect
                const scale = 1 + Math.sin(Date.now() * 0.001 + i) * 0.1;
                sphere.scale.set(scale, scale, scale);
            });
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // WebSocket connection
        const ws = new WebSocket(`ws://${location.host}`);
        
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'ollama_status') {
                if (msg.ready) {
                    status.textContent = '🟢 Ollama ready';
                    extractBtn.disabled = false;
                } else {
                    status.textContent = '🟡 Ollama starting...';
                    extractBtn.disabled = true;
                }
            }
        };

        ws.onopen = () => console.log('WebSocket connected');
        ws.onerror = () => status.textContent = '🔴 Connection failed';

        extractBtn.onclick = async () => {
            const seed = tokensInput.value.trim();
            status.textContent = '⏳ Discovering related terms...';
            extractBtn.disabled = true;

            try {
                const res = await fetch('/api/expand', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seed, model: 'llama3:8b', count: 30 })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    connections.forEach(c => scene.remove(c));
                    connections.length = 0;
                    manifolds.forEach(m => {
                        scene.remove(m.sphere);
                        scene.remove(m.sprite);
                    });
                    manifolds.length = 0;

                    data.data.forEach(d => createManifold(d, data.data));
                    frameManifolds();
                    
                    status.textContent = `✅ Rendered ${data.data.length} manifolds`;
                    console.log('Manifold data:', data);
                } else {
                    status.textContent = `❌ ${data.detail || 'Unknown error'}`;
                }
            } catch (err) {
                status.textContent = `❌ Error: ${err.message}`;
                console.error(err);
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>

</html>
