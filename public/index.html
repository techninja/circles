<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Circles - Semantic Manifold</title>
    <style>
        body {
            margin: 0;
            font-family: monospace;
            background: #0a0a0a;
            color: #0f0;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        input {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="ui">
        <input id="tokens" placeholder="animalia" value="animalia">
        <button id="extract">Extract Manifold</button>
        <div id="status"></div>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        const status = document.getElementById('status');
        const extractBtn = document.getElementById('extract');
        const tokensInput = document.getElementById('tokens');

        // WebSocket connection
        const ws = new WebSocket(`ws://${location.host}`);
        
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'ollama_status') {
                if (msg.ready) {
                    status.textContent = '🟢 Ollama ready';
                    extractBtn.disabled = false;
                } else {
                    status.textContent = '🟡 Ollama starting...';
                    extractBtn.disabled = true;
                }
            }
        };

        ws.onopen = () => console.log('WebSocket connected');
        ws.onerror = () => status.textContent = '🔴 Connection failed';

        extractBtn.onclick = async () => {
            const tokens = tokensInput.value.split(',').map(t => t.trim());
            status.textContent = '⏳ Extracting...';
            extractBtn.disabled = true;

            try {
                const res = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tokens, model: 'llama3:8b' })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    status.textContent = `✅ Extracted ${data.data.length} points`;
                    console.log('Manifold data:', data);
                } else {
                    status.textContent = `❌ ${data.detail || 'Unknown error'}`;
                }
            } catch (err) {
                status.textContent = `❌ Error: ${err.message}`;
                console.error(err);
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>

</html>
