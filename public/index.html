<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Circles - Semantic Manifold</title>
    <style>
        body { margin: 0; font-family: monospace; background: #0a0a0a; color: #0f0; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; width: 300px; }
        button { background: #0f0; color: #000; border: none; padding: 8px 16px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <input id="tokens" placeholder="animalia" value="animalia">
        <button id="extract">Extract Manifold</button>
        <div id="status"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "/deps/three.js",
            "three/addons/": "/deps/three/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const extractBtn = document.getElementById('extract');
        const tokensInput = document.getElementById('tokens');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a0a);
        camera.position.set(3, 3, 5);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;

        const light = new THREE.DirectionalLight(0x00ff88, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x003322, 0.5));

        let marchingCubes = null;
        let label = null;

        function createMarchingCubes(data) {
            if (marchingCubes) scene.remove(marchingCubes);
            if (label) scene.remove(label);

            const res = data.resolution;
            const field = data.field;
            
            const min = Math.min(...field);
            const max = Math.max(...field);
            
            console.log(`Creating smooth manifold`);
            
            const sphereGeom = new THREE.SphereGeometry(0.08, 8, 8);
            const material = new THREE.MeshPhongMaterial({
                color: 0x00ff88,
                shininess: 30,
                transparent: true,
                opacity: 0.6
            });
            
            const positions = [];
            const threshold = min + (max - min) * 0.5;
            
            for (let i = 0; i < res; i++) {
                for (let j = 0; j < res; j++) {
                    for (let k = 0; k < res; k++) {
                        const idx = i * res * res + j * res + k;
                        const value = field[idx];
                        
                        if (value > threshold) {
                            const x = (i / res - 0.5) * 4;
                            const y = (j / res - 0.5) * 4;
                            const z = (k / res - 0.5) * 4;
                            positions.push({ x, y, z, value });
                        }
                    }
                }
            }
            
            console.log(`Creating ${positions.length} spheres`);
            
            const instancedMesh = new THREE.InstancedMesh(sphereGeom, material, positions.length);
            const matrix = new THREE.Matrix4();
            
            positions.forEach((pos, i) => {
                const scale = 0.5 + (pos.value - min) / (max - min);
                matrix.makeScale(scale, scale, scale);
                matrix.setPosition(pos.x, pos.y, pos.z);
                instancedMesh.setMatrixAt(i, matrix);
            });
            
            instancedMesh.instanceMatrix.needsUpdate = true;
            marchingCubes = instancedMesh;
            scene.add(marchingCubes);
            
            // Add label
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(data.seed, 256, 80);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            label = new THREE.Sprite(spriteMaterial);
            label.scale.set(2, 0.5, 1);
            label.position.set(0, 3, 0);
            scene.add(label);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            if (marchingCubes) {
                marchingCubes.rotation.y += 0.003;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const ws = new WebSocket(`ws://${location.host}`);
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'ollama_status') {
                status.textContent = msg.ready ? '🟢 Ollama ready' : '🟡 Ollama starting...';
                extractBtn.disabled = !msg.ready;
            }
        };

        extractBtn.onclick = async () => {
            const seed = tokensInput.value.trim();
            status.textContent = '⏳ Extracting volume (30s)...';
            extractBtn.disabled = true;

            try {
                const res = await fetch('/api/volume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seed, model: 'llama3:8b', resolution: 32 })
                });

                const data = await res.json();
                console.log('Received data:', data);
                
                if (data.status === 'success') {
                    createMarchingCubes(data.data);
                    status.textContent = `✅ Manifold: ${seed}`;
                } else {
                    status.textContent = `❌ ${data.detail || 'Unknown error'}`;
                }
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
                console.error(err);
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
