<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Circles - Semantic Manifold</title>
    <style>
        body { margin: 0; font-family: monospace; background: #0a0a0a; color: #0f0; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; width: 300px; }
        button { background: #0f0; color: #000; border: none; padding: 8px 16px; cursor: pointer; }
        #status { margin-top: 10px; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <input id="tokens" placeholder="animalia" value="animalia">
        <button id="extract">Discover Manifold</button>
        <div id="status"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="module">
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const extractBtn = document.getElementById('extract');
        const tokensInput = document.getElementById('tokens');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let points = [];
        let seedTerm = '';

        function createSoftBody(data) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Seed term at center
            seedTerm = data[0].label;
            
            // Create soft-body points around seed
            points = data.map((d, i) => {
                const angle = (i / data.length) * Math.PI * 2;
                const dist = 100 + Math.random() * 50;
                return {
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    vx: 0,
                    vy: 0,
                    label: d.label,
                    influence: 1 / (i + 1) // Closer terms have more influence
                };
            });
        }

        function animate() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (points.length === 0) {
                requestAnimationFrame(animate);
                return;
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Physics: soft-body membrane
            points.forEach((p, i) => {
                // Spring to neighbors
                const prev = points[(i - 1 + points.length) % points.length];
                const next = points[(i + 1) % points.length];
                
                p.vx += (prev.x - p.x) * 0.01;
                p.vy += (prev.y - p.y) * 0.01;
                p.vx += (next.x - p.x) * 0.01;
                p.vy += (next.y - p.y) * 0.01;

                // Repulsion from center
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const targetDist = 150;
                const force = (dist - targetDist) * -0.005;
                p.vx += (dx / dist) * force;
                p.vy += (dy / dist) * force;

                // Damping
                p.vx *= 0.95;
                p.vy *= 0.95;

                p.x += p.vx;
                p.y += p.vy;
            });

            // Draw soft membrane
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            points.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.stroke();

            // Fill with gradient
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 200);
            gradient.addColorStop(0, 'rgba(0, 255, 136, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 255, 136, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Draw points and labels
            ctx.fillStyle = '#0f0';
            ctx.font = '12px monospace';
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillText(p.label, p.x + 5, p.y - 5);
            });

            // Draw seed term at center
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(seedTerm, centerX, centerY);

            requestAnimationFrame(animate);
        }
        animate();

        // WebSocket
        const ws = new WebSocket(`ws://${location.host}`);
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'ollama_status') {
                status.textContent = msg.ready ? '🟢 Ollama ready' : '🟡 Ollama starting...';
                extractBtn.disabled = !msg.ready;
            }
        };

        extractBtn.onclick = async () => {
            const seed = tokensInput.value.trim();
            status.textContent = '⏳ Discovering...';
            extractBtn.disabled = true;

            try {
                const res = await fetch('/api/expand', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seed, model: 'llama3:8b', count: 20 })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    createSoftBody(data.data);
                    status.textContent = `✅ Manifold: ${data.data.length} terms`;
                }
            } catch (err) {
                status.textContent = `❌ ${err.message}`;
            } finally {
                extractBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
